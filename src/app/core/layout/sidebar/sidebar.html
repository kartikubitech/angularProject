<div

   [ngClass]="service.showSidebar ? 'opacity-100' : 'opacity-0 hidden'"

>
  <div class="p-6">
    <!-- Sidebar Header -->
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center space-x-2">
        <div
          class="w-10 h-10 bg-gradient-to-br from-purple-600 to-pink-600 rounded-lg flex items-center justify-center"
        >
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 10V3L4 14h7v7l9-11h-7z"
            ></path>
          </svg>
        </div>
        <span
          class="text-xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent"
        >
          BrandName
        </span>
      </div>
      <!-- <button (click)="closeSidebar()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button> -->
    </div>

    <!-- Sidebar Navigation -->
    <nav class="space-y-2">
      <a
        href="#"
        class="sidebar-link flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-700 hover:text-purple-600"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
          ></path>
        </svg>
        <span class="font-medium">Home</span>
      </a>

      <a
        href="#"
        class="sidebar-link flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-700 hover:text-purple-600"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
        <span class="font-medium">About</span>
      </a>

      <!-- Sidebar Dropdown -->
     

      <a
        href="#"
        class="sidebar-link flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-700 hover:text-purple-600"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
          ></path>
        </svg>
        <span class="font-medium">Portfolio</span>
      </a>

      <a
        href="#"
        class="sidebar-link flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-700 hover:text-purple-600"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
          ></path>
        </svg>
        <span class="font-medium">Contact</span>
      </a>
    </nav>

    <!-- Sidebar Buttons -->
    <div class="mt-8 space-y-3">
      <button
        class="w-full py-3 text-purple-600 font-medium border-2 border-purple-600 rounded-lg hover:bg-purple-600 hover:text-white transition-all hover:shadow-lg"
      >
        Login
      </button>
      <button
        class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-medium rounded-lg hover:shadow-lg transition-all"
      >
        Sign Up
      </button>
    </div>
  </div>
</div>
