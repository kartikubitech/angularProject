<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4 
bg-gradient-to-br from-blue-300 via-cyan-400 to-teal-600  animate-fadeIn" >

    <div class="w-full max-w-md shadow-2xl">
      <!-- Added 'card' class for the hover effect -->
      <div class="card   bg-gradient-to-br from-pink-300 via-blue-300 to-fuchsia-300 p-4 animate-fadeInp-8 rounded-xl shadow-lg">

        <!-- Header Section with animated Icon -->
        <div class="text-center mb-4">
            <div class="icon-container inline-block p-2 bg-blue-500 rounded-full mb-2">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Create Account</h2>
            <p class="text-gray-600 mt-2">Join us today and get started</p>
        </div>

        <form class="space-y-6">
            <!-- Mobile Field (Uses focus-pink class) -->
            <div class="input-group">
                <label for="mobile" class="block text-sm font-medium text-gray-700 mb-2">Mobile Number</label>
                <div class="relative">
                    <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    <input type="tel" id="mobile" placeholder="+1 234 567 8900" required
                           class="focus-blue w-full pl-12 pr-4 py-3 border-2 border-gray-300 rounded-xl">
                </div>
            </div>

            <!-- Email Field (Uses focus-blue class) -->
            <div class="input-group">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                <div class="relative">
                    <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    <input type="email" id="email" placeholder="john@example.com" required
                           class="focus-blue w-full pl-12 pr-4 py-3 border-2 border-gray-300 rounded-xl">
                </div>
            </div>

            <!-- Password Field (Uses focus-indigo class) -->
            <div class="input-group">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <div class="relative">
                    <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                    <input type="password" id="password" placeholder="••••••••" required
                           class="focus-indigo w-full pl-12 pr-4 py-3 border-2 border-gray-300 rounded-xl">
                </div>
            </div>
            
            <!-- Submit Button (Uses custom hover/active effects) -->
            <div>
                <button type="submit"
                        class="bounce-animation-active w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg
                                hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Sign Up
                </button>
            </div>
        </form>

        <p class="mt-6 text-center text-sm text-gray-600">
            Already have an account?
            <a href="#" class="text-amber-800 hover:underline font-semibold">Log in</a>
        </p>
      </div>
    </div>
</div>
